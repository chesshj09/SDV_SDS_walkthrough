<!doctype html>
<html lang="ko">
<head>
<title>스타듀밸리 공략집</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--fg:#1d2330;--muted:#677084;--line:#dfe3ea;--accent:#2f5fd0;--accent-bg:#e6edfb;--ok:#1d7a4a;--sprite:#eceff4;--love:#c2416b;--love-bg:#fbe7ef;--like:#1d7a4a;--like-bg:#e3f4ea;--neu:#677084;--neu-bg:#eceff4;--dis:#a8650f;--dis-bg:#fbefd9;--hate:#b3261e;--hate-bg:#fbe4e2;
--sans:"Noto Sans KR",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--surface:#1c212a;--fg:#e6e9ef;--muted:#98a1b3;--line:#2c3340;--accent:#7ea2ff;--accent-bg:#232d47;--ok:#6fd49b;--sprite:#2a3140;--love:#ff8fb3;--love-bg:#3a2230;--like:#6fd49b;--like-bg:#1f3328;--neu:#98a1b3;--neu-bg:#2a3140;--dis:#f0b45c;--dis-bg:#3a2f1c;--hate:#ff8a80;--hate-bg:#3d2422;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 8px}h3{font-size:14px;margin:0 0 6px;color:var(--muted);font-weight:500}
.sub,.muted{color:var(--muted);font-size:13px;margin:0}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tab{font:inherit;padding:8px 14px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer}
.tab[aria-selected=true]{color:var(--accent);border-color:var(--accent);font-weight:700}
input[type=search]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.bar{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:12px}
.card>h2{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:13.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
tr:last-child td{border-bottom:0}
.mono{font-family:var(--mono);font-size:12.5px}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--accent-bg);color:var(--accent);margin-right:4px;white-space:nowrap}
.tag.sds{background:var(--love-bg);color:var(--love)}
.row{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.row:first-of-type{border-top:0}
.lv{font-size:12.5px;font-weight:700;padding:3px 0;text-align:center;border-radius:6px}
.lv.love{background:var(--love-bg);color:var(--love)}.lv.like{background:var(--like-bg);color:var(--like)}.lv.neutral{background:var(--neu-bg);color:var(--neu)}.lv.dislike{background:var(--dis-bg);color:var(--dis)}.lv.hate{background:var(--hate-bg);color:var(--hate)}
.items{display:flex;flex-wrap:wrap;gap:5px}
.it{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:2px 8px 2px 3px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.it.cat{padding:2px 9px;background:var(--accent-bg);border-color:transparent;color:var(--accent)}
.it.plain{padding:2px 9px}
.it img{width:24px;height:24px;image-rendering:pixelated;background:var(--sprite);border-radius:3px}
.it.sds{border-color:var(--love)}
.empty{color:var(--muted);font-size:13px}
.sub-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.note{color:var(--muted);font-size:13px;margin:8px 0 0;padding-left:16px}
.note li{margin:2px 0}
.step{display:flex;gap:10px;font-size:13px}.step b{font-family:var(--mono);font-weight:500;color:var(--muted);min-width:46px}
details{border-top:1px solid var(--line);padding:6px 0}details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:500}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.code{font-family:var(--mono);font-size:13px;background:var(--accent-bg);color:var(--accent);border:0;border-radius:4px;padding:3px 7px;cursor:pointer;text-align:left;word-break:break-all}
.code.done{color:var(--ok)}
.spr{display:block;width:32px;height:32px;image-rendering:pixelated;background:var(--sprite);border-radius:4px}
.en{color:var(--muted);font-size:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}.lv{width:64px}}

</style>
</head>

function npcHTML(n){
 const [s,d]=n.bday;const sc=n.src==='SDS'?'sds':'';
 let h=`<div class="card"><h2>${esc(n.ko)} <span class="tag ${sc}">${n.src}</span><span class="muted">생일 ${SEA[s]} ${d}일${n.romance?' · 연애 가능':''}</span></h2>`;
 h+=`<h3>선물 선호도</h3>${giftHTML(n)}</div>`;
 h+=`<div class="card"><h2>영화 선호도</h2>${n.movies?movieHTML(n.movies)+(n.movies_married?movieHTML(n.movies_married,'결혼한 뒤'):''):'<p class="empty">영화관 반응 정보가 없어요.</p>'}</div>`;
 h+=`<div class="card"><h2>영화관 간식 선호도</h2>${n.snacks?snackHTML(n.snacks):'<p class="empty">간식 선호 정보가 없어요.</p>'}</div>`;
 h+=`<div class="card"><h2>이벤트 공략</h2>${evTable(n.events,'')}`;
 const notes=[...(n.notes||[]),...(n.letters||[])];if(notes.length)h+=`<ul class="note">${notes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;h+='</div>';
 if(n.bevents&&n.bevents.length)h+=`<div class="card"><h2>생일 이벤트 공략</h2>${evTable(n.bevents,'B')}</div>`;
 if(n.dlc&&n.dlc.length)h+=`<div class="card"><h2>DLC·커플룩 이벤트</h2><p class="muted" style="margin-bottom:8px">DLC 모드를 따로 설치했을 때만 나오는 이벤트예요. 커플룩은 옷가게 오픈 이벤트(19215104)를 본 뒤 8하트 + 연애 중일 때 나와요.</p>${dlcTable(n.dlc)}</div>`;
 h+=`<div class="card"><h2>스케줄</h2>${schedHTML(n)}</div>`;return h}
function drawNpc(){const m=$('main');const list=G.npcs.filter(n=>(st.nsrc==='전체'||n.src===st.nsrc)&&(!st.q||n.ko.includes(st.q)||n.key.toLowerCase().includes(st.q.toLowerCase())));
 const cur=G.npcs.find(n=>n.key===st.npc)||G.npcs[0];
 m.innerHTML=`<div class="bar"><input type="search" id="q" placeholder="이름으로 검색" value="${esc(st.q)}" aria-label="검색"><div class="chips" id="ns">${chips(['전체','바닐라','SDS'],st.nsrc,'ns')}</div><div class="chips" id="nl">${list.map(n=>`<button class="chip" aria-pressed="${n.key===cur.key}" data-n="${esc(n.key)}">${esc(n.ko)}</button>`).join('')||'<span class="empty">결과 없음</span>'}</div></div>${univHTML()}${npcHTML(cur)}`;
 const q=$('q');q.addEventListener('input',()=>{st.q=q.value.trim();const p=q.selectionStart;drawNpc();const q2=$('q');q2.focus();q2.setSelectionRange(p,p)})}
function fishRows(){const q=st.fq.toLowerCase();return G.fish.filter(f=>(st.fsrc==='전체'||f.src===st.fsrc)&&(st.fk==='전체'||(st.fk==='통발'?f.kind==='trap':f.kind==='rod'))&&(st.fsea==='전체'||f.kind==='trap'||f.season==='사계절'||f.season.includes(st.fsea))&&(!q||f.n.toLowerCase().includes(q)||(f.en||'').toLowerCase().includes(q)||(f.loc||[]).some(l=>l.loc.toLowerCase().includes(q))))}
function drawFish(){const rs=fishRows();const rods=rs.filter(f=>f.kind==='rod'),traps=rs.filter(f=>f.kind==='trap');
 const nm=f=>`<td><div style="display:flex;gap:8px;align-items:center">${IM[f.id]?`<img class="spr" src="${IM[f.id]}" alt="">`:''}<div>${esc(f.n)} ${f.src==='SDS'?'<span class="tag sds">SDS</span>':''}<div class="en">${esc(f.en||'')}</div></div></div></td>`;
 let h=`<div class="bar"><input type="search" id="fq" placeholder="물고기 이름이나 장소로 검색" value="${esc(st.fq)}" aria-label="검색"><div class="chips">${chips(['전체','바닐라','SDS'],st.fsrc,'fs')}</div><div class="chips">${chips(['전체','봄','여름','가을','겨울'],st.fsea,'fe')}</div><div class="chips">${chips(['전체','낚싯대','통발'],st.fk==='rod'?'낚싯대':st.fk,'fk')}</div><div class="muted">${rs.length}종</div></div>`;
 if(rods.length)h+=`<div class="tw"><table><thead><tr><th>물고기</th><th>장소</th><th>시간</th><th>계절</th><th>날씨</th><th>난이도·행동</th><th>크기(인치)</th></tr></thead><tbody>${rods.map(f=>`<tr>${nm(f)}<td>${(f.loc||[]).map(l=>`${esc(l.loc)}${l.area?` <span class="en">(${esc(l.area)})</span>`:''}${l.note?` <span class="en">· ${esc(l.note)}</span>`:''}`).join('<br>')||'<span class="empty">-</span>'}</td><td>${esc(f.time)}</td><td>${esc(f.season)}</td><td>${esc(f.weather)}</td><td>${f.diff} · ${esc(f.beh)}${f.lvl?`<div class="en">낚시 ${f.lvl}레벨↑</div>`:''}</td><td>${esc(f.size)}</td></tr>`).join('')}</tbody></table></div>`;
 if(traps.length)h+=`<div class="card"><h2>통발</h2><div class="tw"><table><thead><tr><th>이름</th><th>설치 장소</th><th>확률</th></tr></thead><tbody>${traps.map(f=>`<tr>${nm(f)}<td>${esc(f.where)}</td><td>${f.chance}</td></tr>`).join('')}</tbody></table></div></div>`;
 $('main').innerHTML=h;const q=$('fq');q.addEventListener('input',()=>{st.fq=q.value.trim();const p=q.selectionStart;drawFish();const q2=$('fq');q2.focus();q2.setSelectionRange(p,p)})}
function drawItems(){const s=st;s.isrc=s.isrc||'전체';s.iq=s.iq||'';s.it=s.it||'전체';
 const types=['전체',...new Set(D.filter(r=>s.isrc==='전체'||r.src===s.isrc).map(r=>r.type))];
 const q=s.iq.toLowerCase();const rs=D.filter(r=>(s.isrc==='전체'||r.src===s.isrc)&&(s.it==='전체'||r.type===s.it)&&(!q||r.ko.toLowerCase().includes(q)||r.en.toLowerCase().includes(q)||r.id.toLowerCase().includes(q)));
 $('main').innerHTML=`<div class="bar"><input type="search" id="iq" placeholder="한글·영문 이름이나 코드로 검색" value="${esc(s.iq)}" aria-label="검색"><div class="chips">${chips(['전체','바닐라','SDS'],s.isrc,'is')}</div><div class="chips">${chips(types,s.it,'ity')}</div><div class="muted">${rs.length>400?rs.length+'개 중 400개만 표시':rs.length+'개'}</div></div><div class="tw"><table><thead><tr><th></th><th>이름</th><th>코드</th><th>종류</th><th>출처</th></tr></thead><tbody>${rs.slice(0,400).map(r=>`<tr><td style="width:44px">${r.img?`<img class="spr" src="${r.img}" alt="" loading="lazy">`:''}</td><td>${esc(r.ko)} <span class="en">${esc(r.en)}</span>${r.note?` <span class="en">(${esc(r.note)})</span>`:''}</td><td><button class="code" data-c="${esc(r.id)}">${esc(r.id)}</button></td><td>${esc(r.type)}</td><td class="en">${r.src}</td></tr>`).join('')}</tbody></table></div>`;
 const q2=$('iq');q2.addEventListener('input',()=>{s.iq=q2.value.trim();const p=q2.selectionStart;drawItems();const e=$('iq');e.focus();e.setSelectionRange(p,p)})}
function draw(){$('tabs').innerHTML=[['npc','인물'],['fish','낚시'],['items','아이템 코드표']].map(([k,l])=>`<button class="tab" role="tab" aria-selected="${st.tab===k}" data-t="${k}">${l}</button>`).join('');
 st.tab==='npc'?drawNpc():st.tab==='fish'?drawFish():drawItems()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.t){st.tab=d.t;history.replaceState(null,'','#'+(d.t==='npc'?'npc='+st.npc:d.t))}
 else if(d.ns){st.nsrc=d.ns}
 else if(d.n){st.npc=d.n;st.gi=0;history.replaceState(null,'','#npc='+d.n)}
 else if(d.gi!==undefined){st.gi=+d.gi}
 else if(d.fs){st.fsrc=d.fs}else if(d.fe){st.fsea=d.fe}else if(d.fk){st.fk=d.fk==='낚싯대'?'rod':d.fk}
 else if(d.is){st.isrc=d.is;st.it='전체'}else if(d.ity){st.it=d.ity}
 else if(d.c){const t=d.c,o=b.textContent;const ok=()=>{b.textContent='복사됨';setTimeout(()=>b.textContent=o,900)};(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(ok).catch(()=>{});return}
 else return;
 const y=scrollY;draw();if(!d.n&&!d.t)scrollTo(0,y)});
draw();

</script>
</body>
</html>
